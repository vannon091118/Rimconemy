<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#101820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c0f14;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="110%" r="70%">
      <stop offset="0%" style="stop-color:#c83c3c;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#c83c3c;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#1e508c;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e508c;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c83c3c;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#c83c3c;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#c83c3c;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#c83c3c;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#c83c3c;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <!-- Hexagon decoration top-right -->
  <polygon points="1100,80 1150,108 1150,162 1100,190 1050,162 1050,108"
           fill="none" stroke="rgba(200,60,60,0.25)" stroke-width="2"/>
  <polygon points="1100,95 1140,115 1140,155 1100,175 1060,155 1060,115"
           fill="none" stroke="rgba(200,60,60,0.15)" stroke-width="1"/>

  <!-- Dots decoration top-left -->
  <circle cx="80" cy="72" r="2" fill="rgba(200,60,60,0.8)"/>
  <circle cx="92" cy="72" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="104" cy="72" r="2" fill="rgba(200,60,60,0.8)"/>
  <circle cx="116" cy="72" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="128" cy="72" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="80" cy="96" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="92" cy="96" r="2" fill="rgba(200,60,60,0.8)"/>
  <circle cx="104" cy="96" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="116" cy="96" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="128" cy="96" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="80" cy="120" r="2" fill="rgba(200,60,60,0.8)"/>
  <circle cx="92" cy="120" r="2" fill="rgba(200,60,60,0.4)"/>
  <circle cx="104" cy="120" r="2" fill="rgba(200,60,60,0.8)"/>
  <circle cx="116" cy="120" r="2" fill="rgba(200,60,60,0.8)"/>
  <circle cx="128" cy="120" r="2" fill="rgba(200,60,60,0.4)"/>

  <!-- Crosshair bottom-left -->
  <line x1="40" y1="530" x2="140" y2="530" stroke="rgba(200,60,60,0.3)" stroke-width="1"/>
  <line x1="90" y1="480" x2="90" y2="580" stroke="rgba(200,60,60,0.3)" stroke-width="1"/>

  <!-- Label -->
  <text x="600" y="240" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" 
        letter-spacing="6" fill="rgba(200,60,60,0.9)">RIMWORLD 1.6 · PRE-ALPHA</text>

  <!-- Main title -->
  <text x="600" y="330" text-anchor="middle" 
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="96" font-weight="700" 
        letter-spacing="12" fill="#f0f0f0"
        filter="url(#shadow)">RIMCONEMY</text>

  <!-- Tagline -->
  <text x="600" y="370" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" 
        letter-spacing="2" fill="rgba(240,240,240,0.7)">Wachstum erzeugt Aufmerksamkeit. Leider.</text>

  <!-- Module pills -->
  <rect x="280" y="400" width="110" height="36" rx="4" 
        fill="rgba(200,60,60,0.1)" stroke="rgba(200,60,60,0.8)" stroke-width="1"/>
  <text x="335" y="423" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" 
        letter-spacing="2" fill="rgba(200,60,60,1)">FOUNDATION</text>

  <rect x="400" y="400" width="90" height="36" rx="4" 
        fill="rgba(200,60,60,0.1)" stroke="rgba(200,60,60,0.8)" stroke-width="1"/>
  <text x="445" y="423" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" 
        letter-spacing="2" fill="rgba(200,60,60,1)">SURVIVAL</text>

  <rect x="500" y="400" width="100" height="36" rx="4" 
        fill="rgba(200,60,60,0.1)" stroke="rgba(200,60,60,0.8)" stroke-width="1"/>
  <text x="550" y="423" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" 
        letter-spacing="2" fill="rgba(200,60,60,1)">ECONOMY</text>

  <rect x="610" y="400" width="110" height="36" rx="4" 
        fill="rgba(200,60,60,0.06)" stroke="rgba(200,60,60,0.4)" stroke-width="1"/>
  <text x="665" y="423" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" 
        letter-spacing="2" fill="rgba(240,240,240,0.6)">SCAVENGER</text>

  <rect x="730" y="400" width="90" height="36" rx="4" 
        fill="rgba(200,60,60,0.06)" stroke="rgba(200,60,60,0.4)" stroke-width="1"/>
  <text x="775" y="423" text-anchor="middle" 
        font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" 
        letter-spacing="2" fill="rgba(240,240,240,0.6)">INFECTED</text>

  <!-- Bottom bar -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#bar)"/>

  <!-- Version tag -->
  <text x="1160" y="610" text-anchor="end" 
        font-family="Arial, Helvetica, sans-serif" font-size="12" 
        letter-spacing="3" fill="rgba(240,240,240,0.25)">PRE-ALPHA · RIMWORLD 1.6</text>
</svg>
