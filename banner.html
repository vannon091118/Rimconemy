<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rimconemy Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #0a0e14;
  }

  .banner {
    width: 1200px;
    height: 630px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(ellipse 120% 80% at 50% 110%, rgba(200, 40, 40, 0.35), transparent 70%),
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(30, 80, 140, 0.3), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 20%, rgba(80, 40, 100, 0.25), transparent 60%),
      linear-gradient(175deg, #0d1117 0%, #101820 40%, #0c0f14 100%);
    overflow: hidden;
  }

  /* Scanlines */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
  }

  /* Hex pattern top-right */
  .hex-decor {
    position: absolute;
    top: 40px;
    right: 60px;
    width: 180px;
    height: 180px;
    border: 2px solid rgba(200, 60, 60, 0.25);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 1;
  }
  .hex-decor::after {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(200, 60, 60, 0.15);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }

  /* Cross-hair left */
  .crosshair {
    position: absolute;
    bottom: 80px;
    left: 80px;
    width: 100px;
    height: 100px;
    z-index: 1;
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(200, 60, 60, 0.3);
  }
  .crosshair::before {
    top: 50%; left: 0; width: 100%; height: 1px;
    transform: translateY(-0.5px);
  }
  .crosshair::after {
    left: 50%; top: 0; height: 100%; width: 1px;
    transform: translateX(-0.5px);
  }

  /* Dots decoration */
  .dots {
    position: absolute;
    top: 60px;
    left: 80px;
    display: grid;
    grid-template-columns: repeat(5, 8px);
    gap: 12px;
    z-index: 1;
  }
  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(200, 60, 60, 0.4);
  }
  .dot.active { background: rgba(200, 60, 60, 0.8); box-shadow: 0 0 8px rgba(200, 60, 60, 0.5); }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 80px;
  }

  .label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(200, 60, 60, 0.9);
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 96px;
    letter-spacing: 12px;
    text-transform: uppercase;
    color: #f0f0f0;
    line-height: 1;
    margin-bottom: 16px;
    text-shadow:
      0 0 60px rgba(200, 60, 60, 0.4),
      0 4px 20px rgba(0, 0, 0, 0.6);
  }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 20px;
    color: rgba(240, 240, 240, 0.7);
    letter-spacing: 2px;
    line-height: 1.5;
    margin-bottom: 36px;
  }

  .modules {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .module {
    padding: 8px 20px;
    border: 1px solid rgba(200, 60, 60, 0.4);
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(240, 240, 240, 0.6);
    background: rgba(200, 60, 60, 0.06);
  }
  .module.highlight {
    border-color: rgba(200, 60, 60, 0.8);
    color: rgba(200, 60, 60, 1);
    background: rgba(200, 60, 60, 0.1);
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      transparent,
      rgba(200, 60, 60, 0.6) 30%,
      rgba(200, 60, 60, 0.9) 50%,
      rgba(200, 60, 60, 0.6) 70%,
      transparent
    );
    z-index: 3;
  }

  /* Version tag */
  .version {
    position: absolute;
    bottom: 20px;
    right: 40px;
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(240, 240, 240, 0.25);
    z-index: 3;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="hex-decor"></div>
  <div class="crosshair"></div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>

  <div class="content">
    <div class="label">RimWorld 1.6 Overhaul</div>
    <h1>RIMCONEMY</h1>
    <div class="tagline">Wachstum erzeugt Aufmerksamkeit.</div>
    <div class="modules">
      <div class="module highlight">Foundation</div>
      <div class="module highlight">Survival</div>
      <div class="module highlight">Scavenger</div>
      <div class="module">Economy</div>
      <div class="module">Infected</div>
    </div>
  </div>

  <div class="bottom-bar"></div>
  <div class="version">v0.1 — RIMWORLD 1.6</div>
</div>
</body>
</html>
